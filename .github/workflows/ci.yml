name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Third-party terms
        run: pnpm check:terms

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @phasejumper/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Accessibility
        run: pnpm --filter @phasejumper/web exec node --experimental-strip-types scripts/lighthouse-a11y.ts

      # Phase map screenshots: on a missing baseline Playwright writes the new
      # image; on a mismatch it writes actual/diff images. Kept for review.
      - name: Upload phase map screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phasemap-screenshots
          path: |
            apps/web/e2e/phasemap/__screenshots__/
            apps/web/test-results/
          if-no-files-found: ignore
