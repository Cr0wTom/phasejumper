name: Update phase map baselines

# Run only when a PR intentionally changes the phase map's look
# (docs/CONTRIBUTING.md). Renders on CI's Linux Chromium and uploads the
# new baselines as an artifact for review; it never commits.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to render
        required: true

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @phasejumper/web exec playwright install --with-deps chromium

      - name: Render baselines
        run: pnpm --filter @phasejumper/web exec playwright test --project=phasemap --update-snapshots
        env:
          PW_VISUAL: "1"

      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: phasemap-baselines
          path: apps/web/e2e/phasemap/__screenshots__/
